<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>03 — Nietzsche, amor fati</title>
<link rel="stylesheet" href="../../post.css">
<style>
  .post { --acento: #9c5a1f; --fio: rgba(26, 23, 20, .32); --fundo: var(--papel); --grao: .34; }

  .conteudo {
    position: absolute;
    inset: 0;
    padding: 140px var(--margem) 170px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .cabeca {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 60px;
  }
  .retrato {
    width: 116px;
    height: 116px;
    border-radius: 50%;
    overflow: hidden;
    border: 1px solid var(--fio);
  }
  .letra {
    font-family: 'Inter', sans-serif;
    font-weight: 300;
    font-size: 19px;
    letter-spacing: .32em;
    color: var(--suave);
  }

  .termo {
    font-weight: 700;
    font-style: italic;
    font-size: 168px;
    line-height: .95;
    letter-spacing: -.015em;
    color: var(--acento);
  }
  .gramatica {
    margin-top: 26px;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 38px;
    line-height: 1.3;
    color: var(--suave);
  }
  .fio {
    height: 1px;
    background: var(--tinta);
    opacity: .4;
    margin: 50px 0 48px;
  }
  .definicao {
    font-weight: 700;
    font-size: 64px;
    line-height: 1.17;
    letter-spacing: -.005em;
  }
  .definicao .num {
    font-family: 'Inter', sans-serif;
    font-weight: 400;
    font-size: 30px;
    vertical-align: .55em;
    margin-right: 10px;
    color: var(--suave);
  }
  .atribuicao { margin-top: 52px; }
  .atribuicao small { display: block; margin-top: 6px; font-size: 22px; opacity: .85; }
</style>
</head>
<body>
<main class="post post--claro">
  <div class="moldura"></div>

  <div class="conteudo">
    <div class="cabeca">
      <span class="rubrica">Verbete</span>
      <div class="retrato so-com-retrato">
        <img src="../retratos/nietzsche.jpg" alt="Friedrich Nietzsche" style="--enquadramento: 50% 30%">
      </div>
      <span class="letra so-sem-retrato">N.º 01</span>
    </div>

    <h1 class="termo">amor fati</h1>
    <p class="gramatica">loc. lat. · literalmente, “amor ao destino”</p>

    <div class="fio"></div>

    <p class="definicao"><span class="num">1.</span>Não querer que nada seja diferente, nem para a frente, nem para trás, <em>por toda a eternidade.</em></p>

    <p class="atribuicao">— Friedrich Nietzsche, <i>Ecce Homo</i> (1888)
      <small>O termo aparece antes em <i>A Gaia Ciência</i>, §276 (1882)</small></p>
  </div>

  <div class="marca">@cafenocopo_americano</div>
</main>
<script src="../../retrato.js"></script>
</body>
</html>
